services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      # Solo accesible desde el propio servidor; el servidor web (Apache/nginx o Caddy) hace de proxy.
      - "127.0.0.1:${APP_PORT:-3010}:3000"
  escaner:
    # Radiografía Web (escáner de seguridad). Se publica en https://escaner.civicloud.es con un proxy a 127.0.0.1:3011
    build: ./escaner
    restart: unless-stopped
    env_file: .env
    environment:
      - ESCANER_URL=${ESCANER_URL:-https://escaner.civicloud.es}
    volumes:
      - escaner_data:/data
    ports:
      - "127.0.0.1:${ESCANER_PORT:-3011}:3011"
  investiga:
    # Investiga (OSINT de fuentes públicas). Se publica en https://investiga.civicloud.es con un proxy a 127.0.0.1:3012
    build: ./investiga
    restart: unless-stopped
    env_file: .env
    environment:
      - INVESTIGA_URL=${INVESTIGA_URL:-https://investiga.civicloud.es}
    volumes:
      - investiga_data:/data
    ports:
      - "127.0.0.1:${INVESTIGA_PORT:-3012}:3012"
  caddy:
    # Solo se usa en servidores con los puertos 80/443 libres: docker compose --profile caddy up -d
    profiles: ["caddy"]
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
volumes:
  caddy_data:
  escaner_data:
  investiga_data:
